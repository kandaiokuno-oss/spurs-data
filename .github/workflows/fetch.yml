name: fetch-nba

on:
  schedule:
    # UTC指定。01:00 UTC = 10:00 JST, 06:00 UTC = 15:00 JST
    - cron: "0 1 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:   # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch stats and news
        run: python spurs_fetch.py

      - name: Commit results
        run: |
          git config user.name "spurs-bot"
          git config user.email "spurs-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
